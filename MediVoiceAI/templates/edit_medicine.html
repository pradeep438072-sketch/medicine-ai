{% extends "base.html" %}

{% block title %}Edit Medicine – MediVoice AI{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold text-dark mb-1">✏️ Edit Medicine</h3>
                        <p class="text-muted mb-0">Update prescription details for {{ med.name }}</p>
                    </div>
                    <a href="{{ url_for('medicine_details_page', med_id=med.id) }}" class="btn btn-outline-secondary rounded-pill px-3">← Back</a>
                </div>

                <form method="POST" action="{{ url_for('edit_medicine_page', med_id=med.id) }}">
                    <div class="row g-3">
                        <div class="col-md-7">
                            <label class="form-label fw-semibold text-secondary">Medicine Name <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control" value="{{ med.name }}" required>
                        </div>

                        <div class="col-md-5">
                            <label class="form-label fw-semibold text-secondary">Category</label>
                            <input type="text" name="category" class="form-control" value="{{ med.category }}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-secondary">Generic / Brand Name</label>
                            <input type="text" name="generic_name" class="form-control" value="{{ med.generic_name or '' }}">
                        </div>

                        <div class="col-md-3">
                            <label class="form-label fw-semibold text-secondary">Dosage Amount <span class="text-danger">*</span></label>
                            <input type="text" name="dosage_amount" class="form-control" value="{{ med.dosage_amount }}" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold text-secondary">Unit <span class="text-danger">*</span></label>
                            <input type="text" name="dosage_unit" class="form-control" value="{{ med.dosage_unit }}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-secondary">Frequency</label>
                            <input type="text" name="frequency" class="form-control" value="{{ med.frequency }}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-secondary">Doses Per Day</label>
                            <input type="number" name="doses_per_day" class="form-control" min="1" max="10" value="{{ med.doses_per_day }}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-secondary">Reminder Time (12-Hour AM/PM) <span class="text-danger">*</span></label>
                            <input type="text" name="reminder_time" class="form-control font-monospace" value="{{ med.reminder_time }}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-secondary">Dosage Limit</label>
                            <input type="text" name="dosage_limit" class="form-control" value="{{ med.dosage_limit }}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-secondary">Start Date</label>
                            <input type="date" name="start_date" class="form-control" value="{{ med.start_date }}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-secondary">End Date</label>
                            <input type="date" name="end_date" class="form-control" value="{{ med.end_date or '' }}">
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold text-secondary">Additional Notes</label>
                            <textarea name="notes" class="form-control" rows="3">{{ med.notes or '' }}</textarea>
                        </div>

                        <div class="col-12">
                            <div class="form-check form-switch mt-2">
                                <input class="form-check-input" type="checkbox" name="is_active" id="isActiveCheck" {% if med.is_active %}checked{% endif %}>
                                <label class="form-check-label fw-semibold" for="isActiveCheck">Currently Active Prescription</label>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-3 mt-4 pt-3 border-top">
                        <a href="{{ url_for('medicine_details_page', med_id=med.id) }}" class="btn btn-light px-4 rounded-pill">Cancel</a>
                        <button type="submit" class="btn btn-primary px-5 rounded-pill fw-bold shadow-sm">
                            Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

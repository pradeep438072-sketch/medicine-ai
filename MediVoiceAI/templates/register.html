{% extends "base.html" %}

{% block title %}Create Account – MediVoice AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="brand-icon mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.8rem;">💊</div>
                    <h3 class="fw-bold text-dark">Create Account</h3>
                    <p class="text-muted">Start tracking medicines and voice reminders</p>
                </div>

                <form method="POST" action="{{ url_for('register') }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary">Full Name</label>
                        <input type="text" name="name" class="form-control bg-light" placeholder="e.g. John Doe" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary">Email Address</label>
                        <input type="email" name="email" class="form-control bg-light" placeholder="user@example.com" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary">Phone Number</label>
                        <input type="tel" name="phone" class="form-control bg-light" placeholder="+1234567890" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary">Password</label>
                        <input type="password" name="password" class="form-control bg-light" placeholder="At least 6 characters" minlength="6" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold text-secondary">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-control bg-light" placeholder="Confirm your password" minlength="6" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold fs-6 shadow-sm mb-3">
                        Sign Up & Send OTP →
                    </button>
                </form>

                <div class="text-center text-muted small mt-2">
                    Already registered? <a href="{{ url_for('login') }}" class="text-primary fw-semibold text-decoration-none">Log in here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
